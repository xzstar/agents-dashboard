<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agents Dashboard</title>
  <style>
    :root {
      --bg: #f4f5f8;
      --surface: #ffffff;
      --surface-muted: #f7f8fa;
      --surface-hover: #f3f4f8;
      --fg: #1a2233;
      --muted: #566078;
      --faint: #8a92a8;
      --border: #e3e6ee;
      --border-strong: #c8cedb;
      --accent: #4f56e8;
      --accent-soft: #eef0fe;
      --accent-border: #c5caf8;
      --success: #1d9a63;
      --success-soft: #e4f5ed;
      --warning: #c07a12;
      --warning-soft: #fbf1de;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 999px;
      --sh-sm: 0 1px 2px rgba(18,26,44,.05);
      --sh-md: 0 2px 8px rgba(18,26,44,.05), 0 8px 24px rgba(18,26,44,.06);
      --sidebar-w: 236px;
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--font); font-size: 14px; line-height: 1.55; background: var(--bg); color: var(--fg); }

    /* Layout */
    .app { display: flex; height: 100vh; }

    /* Sidebar */
    .sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
    .sidebar-header h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
    .sidebar-header .root-label { display: block; margin-top: 2px; font-size: 10px; color: var(--faint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-section { padding: 12px 8px 4px; }
    .sidebar-section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 0 8px 6px; }
    .proj-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); font-size: 12px; color: var(--muted); cursor: default; transition: background .12s ease; }
    .proj-item:hover { background: var(--surface-hover); }
    .proj-item.selected { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .proj-item .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .proj-item .dot.active { background: var(--success); }
    .proj-item .dot.paused { background: var(--warning); }
    .proj-item .dot.done { background: var(--accent); }
    .proj-item .dot.archived { background: var(--faint); }
    .proj-item .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-footer { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 10px; color: var(--faint); }
    .sidebar-footer .theme-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; border: none; background: transparent; color: var(--faint); font-size: 11px; font-family: var(--font); padding: 0; }
    .sidebar-footer .theme-toggle:hover { color: var(--accent); }

    /* Description + Goals */
    .info-section { padding: 0 24px 8px; }
    .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--sh-sm); padding: 16px 20px; }
    .info-card .desc { font-size: 13px; color: var(--muted); line-height: 1.55; margin-bottom: 12px; }
    .info-card .goals-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin-bottom: 8px; }
    .goal-item { display: flex; align-items: baseline; gap: 8px; font-size: 13px; padding: 4px 0; line-height: 1.45; }
    .goal-item .goal-box { flex-shrink: 0; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--border-strong); border-radius: 4px; font-size: 11px; color: var(--success); background: var(--surface); cursor: pointer; transition: border-color .12s ease, background .12s ease; }
    .goal-item.done .goal-box { background: var(--success); border-color: var(--success); color: #fff; }
    .goal-item.done .goal-text { color: var(--faint); text-decoration: line-through; }
    .goal-item .goal-text { color: var(--fg); }

    /* Edit controls */
    .edit-btn { border: 1px solid var(--border); background: var(--surface); color: var(--faint); font-size: 11px; padding: 2px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: border-color .12s ease, color .12s ease; }
    .edit-btn:hover { border-color: var(--accent-border); color: var(--accent); }
    .desc-edit { width: 100%; min-height: 40px; padding: 6px 10px; border: 1px solid var(--accent-border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font); color: var(--fg); background: var(--surface-muted); resize: vertical; outline: none; }
    .goal-add-form { display: flex; gap: 6px; margin-top: 6px; }
    .goal-add-form input { flex: 1; padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-family: var(--font); outline: none; }
    .goal-add-form input:focus { border-color: var(--accent-border); }
    .goal-add-form button { padding: 4px 10px; border: none; border-radius: var(--radius-sm); background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; cursor: pointer; }
    .goal-del-btn { border: none; background: transparent; color: var(--faint); font-size: 12px; cursor: pointer; opacity: 0; padding: 0 2px; flex-shrink: 0; }
    .goal-item:hover .goal-del-btn { opacity: 1; }
    .goal-del-btn:hover { color: #d83a48; }

    /* Dark theme */
    :root[data-theme="dark"] {
      --bg: #0d1117; --surface: #151b26; --surface-muted: #121821; --surface-hover: #1c2431;
      --fg: #dde4f0; --muted: #99a4b8; --faint: #69748a;
      --border: #26303f; --border-strong: #3a4658;
      --accent: #7b82f5; --accent-soft: rgba(123,130,245,.13); --accent-border: rgba(123,130,245,.32);
      --success: #4cc38a; --success-soft: rgba(76,195,138,.12);
      --warning: #d99e3f; --warning-soft: rgba(217,158,63,.12);
      --sh-sm: 0 1px 2px rgba(0,0,0,.2);
      --sh-md: 0 2px 8px rgba(0,0,0,.25);
    }
    :root[data-theme="dark"] .goal-item.done .goal-box { background: var(--success); border-color: var(--success); }
    :root[data-theme="dark"] .goal-item .goal-box { background: var(--surface); }
    :root[data-theme="dark"] .task .del-btn:hover { background: rgba(229,98,112,.12); color: #e56270; }
    :root[data-theme="dark"] .add-form button, :root[data-theme="dark"] .goal-add-form button { color: #10131f; }

    /* Timeline day view */
    .tl-toggle { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .tl-toggle button { border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 4px; cursor: pointer; }
    .tl-toggle button.active { background: var(--accent); color: #fff; }
    .tl-day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .tl-day-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--sh-sm); padding: 14px 16px; }
    .tl-day-card .tl-date { font-size: 13px; font-weight: 600; color: var(--fg); margin-bottom: 8px; }
    .tl-day-card .tl-item { font-size: 12px; padding: 3px 0; }

    /* Main */
    .main { flex: 1; overflow-y: auto; }
    .main-header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .main-header h2 { font-size: 15px; font-weight: 600; }
    .main-header .fetched { font-size: 11px; color: var(--faint); }
    .main-header .refresh-btn { border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; padding: 4px 14px; border-radius: var(--radius-sm); cursor: pointer; transition: border-color .12s ease, color .12s ease; }
    .main-header .refresh-btn:hover { border-color: var(--accent-border); color: var(--accent); }

    /* Motivational quote */
    .quote-bar {
      padding: 12px 24px; font-size: 16px; font-weight: 500; color: var(--accent); font-style: italic; text-align: center;
      cursor: pointer; user-select: none; transition: opacity .3s ease;
      background-color: var(--accent-soft);
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40' fill='%234f56e8' fill-opacity='0.04'/%3E%3C/svg%3E");
      border-bottom: 1px solid var(--accent-border);
    }
    .quote-bar:hover { opacity: .8; }

    /* Monitoring KPIs */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding: 16px 24px 0; }
    .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--sh-sm); padding: 15px 17px; }
    .kpi-card .kpi-label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
    .kpi-card .kpi-value { display: block; margin-top: 4px; font-size: 25px; font-weight: 700; line-height: 1.2; color: var(--fg); }
    .kpi-card .kpi-detail { display: block; margin-top: 3px; font-size: 10px; color: var(--faint); }
    .kpi-card.warning { border-color: var(--warning); background: var(--warning-soft); }
    .kpi-card.warning .kpi-value { color: var(--warning); }
    @media (max-width: 1000px) { .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px) { .kpi-grid { grid-template-columns: 1fr; } }

    /* Project health cards */
    .health-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding: 14px 24px 0; }
    .health-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--sh-sm); padding: 15px 17px; cursor: pointer; transition: border-color .12s ease, transform .12s ease; }
    .health-card:hover { border-color: var(--accent-border); transform: translateY(-1px); }
    .health-card.stale { border-color: var(--warning); }
    .health-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .health-top h3 { font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .health-state { flex-shrink: 0; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: var(--radius-full); }
    .health-state.ok { background: var(--success-soft); color: var(--success); }
    .health-state.stale { background: var(--warning-soft); color: var(--warning); }
    .health-meta { margin-top: 5px; font-size: 11px; color: var(--muted); }
    .health-progress { display: flex; align-items: center; gap: 9px; margin-top: 13px; }
    .progress-track { flex: 1; height: 6px; border-radius: var(--radius-full); background: var(--surface-muted); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: var(--radius-full); background: var(--accent); }
    .progress-value { min-width: 34px; text-align: right; font-size: 11px; font-weight: 650; color: var(--muted); }
    .health-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 11px; }
    .health-stat { background: var(--surface-muted); border-radius: var(--radius-sm); padding: 7px 8px; }
    .health-stat b { display: block; font-size: 15px; line-height: 1.2; }
    .health-stat span { display: block; margin-top: 2px; font-size: 10px; color: var(--faint); }

    /* Activity feed */
    .activity-section { margin: 18px 24px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--sh-sm); overflow: hidden; }
    .activity-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 17px; border-bottom: 1px solid var(--border); }
    .activity-title { font-size: 13px; font-weight: 650; }
    .activity-count { font-size: 11px; color: var(--faint); }
    .activity-list { max-height: 300px; overflow-y: auto; }
    .activity-item { display: flex; align-items: baseline; gap: 10px; padding: 9px 17px; border-bottom: 1px solid var(--border); font-size: 12px; }
    .activity-item:last-child { border-bottom: 0; }
    .activity-date { flex-shrink: 0; width: 76px; color: var(--faint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .activity-text { color: var(--fg); line-height: 1.45; }

    /* Trend charts */
    .trend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 18px 24px 0; }
    .trend-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--sh-sm); padding: 14px 16px; }
    .trend-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .trend-top h3 { font-size: 12px; font-weight: 650; color: var(--muted); }
    .trend-total { font-size: 21px; font-weight: 700; }
    .trend-window { margin-top: 2px; font-size: 10px; color: var(--faint); }
    .trend-bars { display: flex; align-items: flex-end; gap: 4px; height: 56px; margin-top: 13px; }
    .trend-bar { flex: 1; min-height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); opacity: .78; }
    .trend-bar.empty { background: var(--border); opacity: .55; }

    /* Goal overview */
    .goal-overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 18px 24px 0; }
    .goal-overview-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--sh-sm); padding: 14px 16px; }
    .goal-overview-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .goal-overview-top h3 { font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .goal-overview-value { flex-shrink: 0; font-size: 17px; font-weight: 700; color: var(--accent); }
    .goal-overview-meta { margin-top: 4px; font-size: 11px; color: var(--muted); }

    /* Search and filters */
    .filter-bar { display: grid; grid-template-columns: minmax(180px, 1fr) auto auto auto; gap: 10px; align-items: center; margin: 14px 24px 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--sh-sm); }
    .filter-bar input[type="search"] { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-muted); color: var(--fg); font-family: var(--font); font-size: 12px; outline: none; }
    .filter-bar input[type="search"]:focus { border-color: var(--accent-border); }
    .status-filters { display: flex; align-items: center; gap: 9px; }
    .status-filters label { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .filter-bar select, .filter-reset { padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--muted); font-family: var(--font); font-size: 11px; cursor: pointer; }
    .filter-reset:hover { color: var(--accent); border-color: var(--accent-border); }
    @media (max-width: 920px) { .filter-bar { grid-template-columns: 1fr; } .status-filters { flex-wrap: wrap; } }

    /* Project drawer */
    .drawer-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(15,22,38,.42); display: flex; justify-content: flex-end; }
    .drawer-overlay[hidden] { display: none; }
    .drawer-panel { width: min(640px, 92vw); height: 100vh; background: var(--bg); border-left: 1px solid var(--border); box-shadow: -18px 0 48px rgba(15,22,38,.18); display: flex; flex-direction: column; }
    .drawer-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .drawer-header h2 { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drawer-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .drawer-close, .drawer-open-board { border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; padding: 5px 10px; border-radius: var(--radius-sm); cursor: pointer; }
    .drawer-close:hover, .drawer-open-board:hover { color: var(--accent); border-color: var(--accent-border); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px 32px; }
    .drawer-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--sh-sm); padding: 15px 17px; margin-bottom: 14px; }
    .drawer-section h3 { font-size: 12px; font-weight: 650; color: var(--muted); margin-bottom: 9px; }
    .drawer-columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .drawer-column { background: var(--surface-muted); border-radius: var(--radius-sm); padding: 9px; }
    .drawer-column h4 { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin-bottom: 7px; }
    .drawer-task { font-size: 12px; padding: 5px 6px; border-radius: 4px; background: var(--surface); margin-bottom: 5px; line-height: 1.35; }
    .drawer-timeline { display: flex; flex-direction: column; gap: 8px; }
    .drawer-timeline-item { display: flex; gap: 9px; font-size: 12px; line-height: 1.45; }
    .drawer-timeline-date { flex-shrink: 0; width: 74px; color: var(--faint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }

    /* Notifications */
    .notification-section { margin: 18px 24px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--sh-sm); overflow: hidden; }
    .notification-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 17px; border-bottom: 1px solid var(--border); }
    .notification-title { font-size: 13px; font-weight: 650; }
    .notification-count { font-size: 11px; color: var(--faint); }
    .notification-list { max-height: 260px; overflow-y: auto; }
    .notification-item { display: flex; align-items: baseline; gap: 10px; padding: 9px 17px; border-bottom: 1px solid var(--border); font-size: 12px; }
    .notification-item:last-child { border-bottom: 0; }
    .notification-item.warning { background: var(--warning-soft); }
    .notification-type { flex-shrink: 0; min-width: 76px; font-size: 10px; font-weight: 700; color: var(--warning); }
    .notification-message { line-height: 1.45; }

    /* Report export */
    .export-actions { display: flex; gap: 8px; }
    .export-btn { border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; padding: 4px 12px; border-radius: var(--radius-sm); cursor: pointer; }
    .export-btn:hover { color: var(--accent); border-color: var(--accent-border); }

    /* Inline edit */
    .inline-edit { width: 100%; padding: 2px 6px; border: 1px solid var(--accent-border); border-radius: 4px; font-size: inherit; font-family: var(--font); color: var(--fg); background: var(--surface-muted); outline: none; resize: none; }

    .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px 24px; }
    @media (max-width: 860px) { .kanban { grid-template-columns: 1fr; } }
    .col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--sh-sm); overflow: hidden; }
    .col-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .col-header .icon { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .col.todo .icon { background: var(--faint); }
    .col.in-progress .icon { background: var(--warning); }
    .col.done .icon { background: var(--success); }
    .col-header h2 { font-size: 13px; font-weight: 600; }
    .col-header .count { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: var(--radius-full); background: var(--surface-muted); color: var(--faint); }
    .col-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
    .col-footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-top: 1px solid var(--border); font-size: 11px; color: var(--faint); }
    .col-footer button { border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 11px; padding: 2px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: border-color .12s ease; }
    .col-footer button:hover:not(:disabled) { border-color: var(--accent-border); color: var(--accent); }
    .col-footer button:disabled { opacity: .35; cursor: default; }

    .task { position: relative; padding: 10px 28px 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 13px; line-height: 1.45; transition: border-color .15s ease, box-shadow .15s ease; cursor: grab; }
    .task:hover { border-color: var(--accent-border); box-shadow: var(--sh-sm); }
    .task.dragging { opacity: .4; border-style: dashed; }
    .task .del-btn { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: var(--faint); font-size: 14px; line-height: 1; border-radius: 4px; cursor: pointer; opacity: 0; transition: opacity .12s ease, background .12s ease; }
    .task:hover .del-btn { opacity: 1; }
    .task .del-btn:hover { background: #fcebed; color: #d83a48; }
    .task .move-btn { position: absolute; top: 6px; right: 24px; border: none; background: transparent; color: var(--faint); font-size: 14px; cursor: pointer; opacity: 0; transition: opacity .12s ease, color .12s ease; padding: 0 2px; }
    .task:hover .move-btn { opacity: 1; }
    .task .move-btn:hover { color: var(--accent); }
    .task .running-dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; vertical-align: middle; border-radius: 50%; background: #e5484d; z-index: 1; animation: running-pulse 1.2s ease-in-out infinite; }
    @keyframes running-pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(229, 72, 77, .45); }
      50% { opacity: .45; box-shadow: 0 0 0 5px rgba(229, 72, 77, 0); }
    }
    .col-body.drag-over { outline: 2px dashed var(--accent-border); outline-offset: -4px; border-radius: var(--radius-md); background: var(--accent-soft); }
    .add-btn { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; padding: 8px; border: 1px dashed var(--border); border-radius: var(--radius-md); background: transparent; color: var(--faint); font-size: 12px; cursor: pointer; transition: border-color .12s ease, color .12s ease; }
    .add-btn:hover { border-color: var(--accent-border); color: var(--accent); }
    .add-form { display: flex; gap: 6px; }
    .add-form input { flex: 1; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-family: var(--font); outline: none; transition: border-color .12s ease; }
    .add-form input:focus { border-color: var(--accent-border); }
    .add-form button { padding: 6px 10px; border: none; border-radius: var(--radius-sm); background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
    .task .proj-tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-bottom: 4px; }
    .task .proj-tag.t0 { background: var(--accent-soft); color: var(--accent); }
    .task .proj-tag.t1 { background: var(--success-soft); color: var(--success); }
    .task .proj-tag.t2 { background: #fbf1de; color: var(--warning); }
    .task .proj-tag.t3 { background: #fcebed; color: #d83a48; }
    .task .proj-tag.t4 { background: var(--surface-muted); color: var(--faint); }
    .col.done .task { opacity: .55; }
    .col.done .task:hover { opacity: 1; }
    .empty { text-align: center; color: var(--faint); font-size: 12px; padding: 2.5rem 0; }

    /* Timeline */
    .timeline-section { padding: 0 24px 48px; }
    .timeline-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .timeline-title { font-size: 13px; font-weight: 600; color: var(--muted); }
    .timeline { position: relative; padding-left: 20px; }
    .timeline::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--border); border-radius: 1px; }
    .tl-entry { position: relative; margin-bottom: 10px; }
    .tl-entry::before { content: ''; position: absolute; left: -20px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--success); border: 2px solid var(--bg); }
    .tl-date { font-size: 11px; font-weight: 600; color: var(--faint); margin-bottom: 2px; }
    .tl-items { display: flex; flex-direction: column; gap: 0; }
    .tl-item { display: flex; align-items: baseline; gap: 6px; font-size: 12px; padding: 3px 8px; border-radius: 4px; line-height: 1.4; }
    .tl-item:hover { background: var(--surface-hover); }
    .tl-item::before { content: '·'; color: var(--faint); font-weight: 700; flex-shrink: 0; }
    .tl-item .proj-tag { font-size: 10px; font-weight: 600; padding: 0 5px; border-radius: 3px; flex-shrink: 0; }
    .tl-item .proj-tag.t0 { background: var(--accent-soft); color: var(--accent); }
    .tl-item .proj-tag.t1 { background: var(--success-soft); color: var(--success); }
    .tl-item .proj-tag.t2 { background: #fbf1de; color: var(--warning); }
    .tl-item .proj-tag.t3 { background: #fcebed; color: #d83a48; }
    .tl-item .proj-tag.t4 { background: var(--surface-muted); color: var(--faint); }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>Agents Dashboard</h1>
        <span class="root-label" id="root-label"></span>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">Monitoring</div>
        <div class="proj-item" id="overview-item" data-name=""><span class="dot" style="background:var(--accent)"></span><span class="name">监控看板</span></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">Projects</div>
        <div id="proj-list"></div>
      </div>
      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle">◐ 暗色主题</button>
        <span id="fetched-at"></span>
      </div>
    </div>
    <div class="main">
      <div class="main-header">
        <h2 id="main-title">All Projects</h2>
        <div class="export-actions">
          <button class="export-btn" id="export-md">导出 Markdown</button>
          <button class="export-btn" id="export-html">导出 HTML</button>
          <button class="refresh-btn" id="refresh-btn">↻ 刷新</button>
        </div>
      </div>
      <div class="quote-bar" id="quote-bar" title="点击换一句"></div>
      <div class="filter-bar">
        <input type="search" id="filter-input" placeholder="搜索项目、任务、目标或变更…" autocomplete="off">
        <div class="status-filters">
          <label><input type="checkbox" data-filter-status="todo" checked> Todo</label>
          <label><input type="checkbox" data-filter-status="in-progress" checked> In Progress</label>
          <label><input type="checkbox" data-filter-status="done" checked> Done</label>
        </div>
        <select id="updated-filter">
          <option value="all">全部更新时间</option>
          <option value="7">7 天内更新</option>
          <option value="30">30 天内更新</option>
        </select>
        <button class="filter-reset" id="filter-reset">重置</button>
      </div>
      <div class="kpi-grid" id="kpi-grid"></div>
      <section class="notification-section">
        <div class="notification-header">
          <div class="notification-title">Notifications</div>
          <div class="notification-count" id="notification-count"></div>
        </div>
        <div class="notification-list" id="notification-list"></div>
      </section>
      <div class="health-grid" id="health-grid"></div>
      <div class="trend-grid" id="trend-grid"></div>
      <div class="goal-overview-grid" id="goal-overview-grid"></div>
      <section class="activity-section">
        <div class="activity-header">
          <div class="activity-title">Activity</div>
          <div class="activity-count" id="activity-count"></div>
        </div>
        <div class="activity-list" id="activity-list"></div>
      </section>
      <div class="info-section" id="info-section" style="display:none">
        <div class="info-card">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
            <div class="desc" id="proj-desc" style="flex:1;margin-bottom:0"></div>
            <button class="edit-btn" id="desc-edit-btn">编辑</button>
          </div>
          <div style="height:12px"></div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <div class="goals-title" style="margin-bottom:0">Goals</div>
            <button class="edit-btn" id="goal-add-btn">+ 目标</button>
          </div>
          <div id="goals-list"></div>
          <div id="goal-add-container" style="display:none">
            <div class="goal-add-form">
              <input type="text" id="goal-add-input" placeholder="输入新目标…">
              <button id="goal-add-save">OK</button>
            </div>
          </div>
        </div>
      </div>
      <div class="kanban">
        <div class="col todo">
          <div class="col-header"><span class="icon"></span><h2>Todo</h2><span class="count" id="count-todo"></span></div>
          <div class="col-body" id="col-todo"></div>
          <div class="col-footer" id="footer-todo" style="display:none"><button id="prev-todo">‹ Prev</button><span id="page-todo"></span><button id="next-todo">Next ›</button></div>
        </div>
        <div class="col in-progress">
          <div class="col-header"><span class="icon"></span><h2>In Progress</h2><span class="count" id="count-in-progress"></span></div>
          <div class="col-body" id="col-in-progress"></div>
          <div class="col-footer" id="footer-in-progress" style="display:none"><button id="prev-in-progress">‹ Prev</button><span id="page-in-progress"></span><button id="next-in-progress">Next ›</button></div>
        </div>
        <div class="col done">
          <div class="col-header"><span class="icon"></span><h2>Done</h2><span class="count" id="count-done"></span></div>
          <div class="col-body" id="col-done"></div>
          <div class="col-footer" id="footer-done" style="display:none"><button id="prev-done">‹ Prev</button><span id="page-done"></span><button id="next-done">Next ›</button></div>
        </div>
      </div>
      <div class="timeline-section">
        <div class="timeline-header">
          <div class="timeline-title">Timeline</div>
          <div class="tl-toggle">
            <button id="tl-list-btn" class="active">List</button>
            <button id="tl-day-btn">Day View</button>
          </div>
        </div>
        <div class="timeline" id="timeline"></div>
        <div class="tl-day-grid" id="timeline-day" style="display:none"></div>
      </div>
    </div>
  </div>
  <div class="drawer-overlay" id="project-drawer-overlay" hidden>
    <aside class="drawer-panel" role="dialog" aria-modal="true">
      <div class="drawer-header">
        <h2 id="project-drawer-title">Project</h2>
        <div class="drawer-actions">
          <button class="drawer-open-board" id="project-drawer-open">打开看板</button>
          <button class="drawer-close" id="project-drawer-close" aria-label="Close">×</button>
        </div>
      </div>
      <div class="drawer-body" id="project-drawer-body"></div>
    </aside>
  </div>
  <script>
    const projectColors = {};
    const PAGE_SIZE = 10;
    const pageState = { todo: 0, "in-progress": 0, done: 0 };
    let colorIdx = 0;
    const colorClasses = ["t0","t1","t2","t3","t4"];
    let selectedProject = null;
    let cachedData = null;
    let drawerProjectName = null;
    const requestedProject = new URLSearchParams(window.location.search).get("project");
    if (requestedProject) selectedProject = requestedProject;
    const STALE_DAYS = 7;
    const TREND_DAYS = 14;
    const filters = { query: "", statuses: new Set(["todo", "in-progress", "done"]), updatedWithin: "all" };

    async function load() {
      try {
        const res = await fetch("/api/projects");
        const { root, projects, fetchedAt } = await res.json();
        cachedData = { root, projects, fetchedAt };
        if (selectedProject && !projects.some(project => project.name === selectedProject)) {
          selectedProject = null;
        }
        document.getElementById("root-label").textContent = root;
        document.getElementById("fetched-at").textContent = new Date(fetchedAt).toLocaleTimeString();
        renderProjects(projects);
        renderKpis(projects);
        renderNotifications(projects);
        renderHealthCards(projects);
        renderTrends(projects);
        renderGoalOverview(projects);
        renderActivityFeed(projects);
        renderBoard(projects);
      } catch (e) { console.error(e); }
    }

    function isStale(project) {
      const updatedAt = Date.parse(project.meta.updated || "");
      if (!Number.isFinite(updatedAt)) return true;
      return Date.now() - updatedAt > STALE_DAYS * 24 * 60 * 60 * 1000;
    }

    function isProjectStale(project) {
      return isStale(project) || !!project.health?.stale;
    }

    function renderKpis(projects) {
      const scopedProjects = getFilteredProjects(projects);
      const metrics = [
        { label: "活跃项目", value: scopedProjects.filter(project => (project.meta.stage || "active") === "active").length, detail: `共 ${scopedProjects.length} 个项目`, tone: "" },
        { label: "进行中任务", value: scopedProjects.reduce((total, project) => total + project.tasks["in-progress"].length, 0), detail: "跨所有项目", tone: "" },
        { label: "完成任务", value: scopedProjects.reduce((total, project) => total + project.tasks.done.length, 0), detail: "累计完成", tone: "" },
        { label: "停滞项目", value: scopedProjects.filter(project => isProjectStale(project)).length, detail: `超过 ${STALE_DAYS} 天未更新或有停滞任务`, tone: "warning" }
      ];
      document.getElementById("kpi-grid").innerHTML = metrics.map(metric => `
        <div class="kpi-card${metric.tone ? ` ${metric.tone}` : ""}">
          <span class="kpi-label">${metric.label}</span>
          <span class="kpi-value">${metric.value}</span>
          <span class="kpi-detail">${metric.detail}</span>
        </div>
      `).join("");
    }

    function renderNotifications(projects) {
      const scopedProjects = getFilteredProjects(projects);
      const notifications = [];
      for (const project of scopedProjects) {
        for (const task of project.health.staleTasks.filter(task => task.stale)) {
          notifications.push({ type: "stale-task", project: project.name, message: `任务「${task.text}」已长期停留在 In Progress` });
        }
        if (isStale(project)) {
          notifications.push({ type: "stale-project", project: project.name, message: `项目已超过 ${STALE_DAYS} 天未更新` });
        }
        const heartbeatAt = Date.parse(project.meta.lastAgentHeartbeat || project.heartbeat?.lastAt || "");
        if (!Number.isFinite(heartbeatAt) || Date.now() - heartbeatAt > STALE_DAYS * 24 * 60 * 60 * 1000) {
          notifications.push({ type: "missing-heartbeat", project: project.name, message: "Agent 心跳缺失或已过期" });
        }
      }
      document.getElementById("notification-count").textContent = `${notifications.length} 条提醒`;
      document.getElementById("notification-list").innerHTML = notifications.map(notification => `
        <div class="notification-item warning">
          <span class="notification-type">${notification.type}</span>
          <span class="proj-tag ${projectColors[notification.project] || "t4"}">${esc(notification.project)}</span>
          <span class="notification-message">${esc(notification.message)}</span>
        </div>
      `).join("") || `<div class="empty">No warnings</div>`;
    }

    function buildReportMarkdown(projects) {
      const lines = [`# Agents Dashboard Report`, ``, `- Generated: ${new Date().toLocaleString()}`, `- Projects: ${projects.length}`, ``];
      for (const project of projects) {
        lines.push(`## ${project.name}`, ``, `- Updated: ${project.meta.updated || "unknown"}`, `- Agent: ${project.meta.agent || project.meta.owner || "unknown"}`, `- Description: ${project.meta.description || project.meta.summary || "none"}`, ``);
        lines.push(`### Tasks`, ``);
        for (const [status, items] of Object.entries(project.tasks)) {
          lines.push(`#### ${status}`, ``);
          for (const text of items) lines.push(`- ${text}`);
          if (!items.length) lines.push(`- None`);
          lines.push(``);
        }
        lines.push(`### Goals`, ``);
        for (const goal of project.goals) lines.push(`- [${goal.done ? "x" : " "}] ${goal.text}`);
        if (!project.goals.length) lines.push(`- None`);
        lines.push(``, `### Timeline`, ``);
        for (const entry of (project.changelog || []).slice(0, 5)) for (const text of entry.items) lines.push(`- ${entry.date}: ${text}`);
        lines.push(``);
      }
      return lines.join("\n");
    }

    function buildReportHtml(projects) {
      const sections = projects.map(project => {
        const tasks = Object.entries(project.tasks).map(([status, items]) => `<h4>${status}</h4><ul>${items.map(text => `<li>${esc(text)}</li>`).join("") || "<li>None</li>"}</ul>`).join("");
        const goals = `<ul>${project.goals.map(goal => `<li>${goal.done ? "✓" : "○"} ${esc(goal.text)}</li>`).join("") || "<li>None</li>"}</ul>`;
        const timeline = `<ul>${(project.changelog || []).flatMap(entry => entry.items.map(text => `<li>${esc(entry.date)}: ${esc(text)}</li>`)).join("") || "<li>None</li>"}</ul>`;
        return `<section><h2>${esc(project.name)}</h2><p>${esc(project.meta.description || project.meta.summary || "No description")}</p><h3>Tasks</h3>${tasks}<h3>Goals</h3>${goals}<h3>Timeline</h3>${timeline}</section>`;
      }).join("");
      return `<!doctype html><meta charset="utf-8"><title>Agents Dashboard Report</title><h1>Agents Dashboard Report</h1><p>Generated ${new Date().toLocaleString()}</p>${sections}`;
    }

    function downloadReport(format) {
      const reportProjects = getFilteredProjects(cachedData.projects);
      const isHtml = format === "html";
      const content = isHtml ? buildReportHtml(reportProjects) : buildReportMarkdown(reportProjects);
      const contentType = isHtml ? "text/html;charset=utf-8" : "text/markdown;charset=utf-8";
      const blob = new Blob([content], { type: contentType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `agents-dashboard-report-${new Date().toISOString().slice(0, 10)}.${format}`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function formatUpdatedAt(project) {
      const timestamp = Date.parse(project.meta.updated || "");
      if (!Number.isFinite(timestamp)) return "未知";
      const diffDays = Math.floor((Date.now() - timestamp) / (24 * 60 * 60 * 1000));
      if (diffDays <= 0) return "今天";
      if (diffDays === 1) return "昨天";
      if (diffDays < 30) return `${diffDays} 天前`;
      return new Date(timestamp).toLocaleDateString();
    }

    function formatHeartbeat(project) {
      const timestamp = Date.parse(project.meta.lastAgentHeartbeat || project.heartbeat?.lastAt || "");
      if (!Number.isFinite(timestamp)) return "未知";
      const ageMinutes = Math.max(0, Math.floor((Date.now() - timestamp) / 60000));
      if (ageMinutes < 1) return "刚刚";
      if (ageMinutes < 60) return `${ageMinutes} 分钟前`;
      const ageHours = Math.floor(ageMinutes / 60);
      if (ageHours < 24) return `${ageHours} 小时前`;
      return `${Math.floor(ageHours / 24)} 天前`;
    }

    function buildTrend(projects, prefixes) {
      const dates = Array.from({ length: TREND_DAYS }, (_, index) => {
        const date = new Date(Date.now() - (TREND_DAYS - 1 - index) * 24 * 60 * 60 * 1000);
        return date.toISOString().slice(0, 10);
      });
      const counts = Object.fromEntries(dates.map(date => [date, 0]));
      for (const project of projects) {
        for (const entry of project.changelog || []) {
          if (!(entry.date in counts)) continue;
          for (const text of entry.items) {
            if (prefixes.some(prefix => text.toLowerCase().startsWith(prefix))) counts[entry.date]++;
          }
        }
      }
      return dates.map(date => ({ date, count: counts[date] }));
    }

    function getFilteredProjects(projects) {
      const scoped = selectedProject ? projects.filter(project => project.name === selectedProject) : projects;
      const query = filters.query.trim().toLowerCase();
      return scoped.filter(project => {
        const updatedAt = Date.parse(project.meta.updated || "");
        if (filters.updatedWithin !== "all" && (!Number.isFinite(updatedAt) || Date.now() - updatedAt > Number(filters.updatedWithin) * 24 * 60 * 60 * 1000)) return false;
        const tasks = { todo: [], "in-progress": [], done: [] };
        let hasMatchingTasks = false;
        for (const status of Object.keys(tasks)) {
          if (!filters.statuses.has(status)) continue;
          tasks[status] = project.tasks[status].filter(text => !query || text.toLowerCase().includes(query));
          hasMatchingTasks = hasMatchingTasks || tasks[status].length > 0;
        }
        const searchTargets = [project.name, project.meta.description || "", project.meta.summary || "", project.goals.map(goal => goal.text).join("\n"), (project.changelog || []).flatMap(entry => entry.items).join("\n")];
        const matchesMetadata = !query || searchTargets.some(target => target.toLowerCase().includes(query));
        return hasMatchingTasks || matchesMetadata;
      }).map(project => {
        const query = filters.query.trim().toLowerCase();
        return {
          ...project,
          tasks: Object.fromEntries(Object.keys(project.tasks).map(status => [
            status,
            filters.statuses.has(status) ? project.tasks[status].filter(text => !query || text.toLowerCase().includes(query)) : []
          ]))
        };
      });
    }

    function refreshFilteredViews() {
      renderKpis(cachedData.projects);
      renderNotifications(cachedData.projects);
      renderHealthCards(cachedData.projects);
      renderTrends(cachedData.projects);
      renderGoalOverview(cachedData.projects);
      renderActivityFeed(cachedData.projects);
      renderBoard(cachedData.projects);
    }

    function renderTrends(projects) {
      const scopedProjects = getFilteredProjects(projects);
      const trendDefinitions = [
        { label: "完成任务", prefixes: ["complete task"] },
        { label: "新增任务", prefixes: ["add task"] },
        { label: "In Progress", prefixes: ["start task"] },
        { label: "Agent 活跃", prefixes: ["start task", "complete task", "add task"] }
      ];
      document.getElementById("trend-grid").innerHTML = trendDefinitions.map(definition => {
        const trend = buildTrend(scopedProjects, definition.prefixes);
        const maxCount = Math.max(1, ...trend.map(item => item.count));
        const total = trend.reduce((sum, item) => sum + item.count, 0);
        return `
          <article class="trend-card">
            <div class="trend-top"><h3>${definition.label}</h3><span class="trend-total">${total}</span></div>
            <div class="trend-window">最近 ${TREND_DAYS} 天</div>
            <div class="trend-bars">
              ${trend.map(item => `<div class="trend-bar${item.count ? "" : " empty"}" style="height:${Math.max(6, item.count / maxCount * 100)}%" title="${item.date}: ${item.count}"></div>`).join("")}
            </div>
          </article>
        `;
      }).join("");
    }

    function renderHealthCards(projects) {
      const healthGrid = document.getElementById("health-grid");
      healthGrid.style.display = selectedProject ? "none" : "grid";
      healthGrid.innerHTML = getFilteredProjects(projects).map(project => {
        const completed = project.tasks.done.length;
        const taskTotal = completed + project.tasks.todo.length + project.tasks["in-progress"].length;
        const progress = taskTotal ? Math.round(completed / taskTotal * 100) : 0;
        const state = isProjectStale(project) ? "停滞" : "正常";
        return `
          <article class="health-card${isProjectStale(project) ? " stale" : ""}" data-name="${escAttr(project.name)}">
            <div class="health-top">
              <h3>${esc(project.name)}</h3>
              <span class="health-state ${isProjectStale(project) ? "stale" : "ok"}">${state}</span>
            </div>
            <div class="health-meta">更新：${formatUpdatedAt(project)} · Agent：${esc(project.meta.agent || project.meta.owner || "未记录")} · 心跳：${formatHeartbeat(project)}</div>
            <div class="health-progress">
              <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
              <span class="progress-value">${progress}%</span>
            </div>
            <div class="health-stats">
              <div class="health-stat"><b>${project.tasks.todo.length}</b><span>Todo</span></div>
              <div class="health-stat"><b>${project.tasks["in-progress"].length}</b><span>In Progress</span></div>
              <div class="health-stat"><b>${completed}</b><span>Done</span></div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderGoalOverview(projects) {
      const scopedProjects = getFilteredProjects(projects);
      document.getElementById("goal-overview-grid").innerHTML = scopedProjects.map(project => {
        const doneGoals = project.goals.filter(goal => goal.done).length;
        const totalGoals = project.goals.length;
        const percentage = totalGoals ? Math.round(doneGoals / totalGoals * 100) : 0;
        return `
          <article class="goal-overview-card">
            <div class="goal-overview-top"><h3>${esc(project.name)}</h3><span class="goal-overview-value">${percentage}%</span></div>
            <div class="goal-overview-meta">${doneGoals} / ${totalGoals} 个目标已完成</div>
            <div class="health-progress">
              <div class="progress-track"><div class="progress-fill" style="width:${percentage}%"></div></div>
              <span class="progress-value">${doneGoals}/${totalGoals}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderProjects(projects) {
      const list = document.getElementById("proj-list");
      const overview = document.getElementById("overview-item");
      overview.classList.toggle("selected", selectedProject === null);
      list.innerHTML = projects.map(p => {
        if (!projectColors[p.name]) projectColors[p.name] = colorClasses[colorIdx++ % colorClasses.length];
        const sel = selectedProject === p.name ? " selected" : "";
        return `<div class="proj-item${sel}" data-name="${esc(p.name)}"><span class="dot ${p.meta.stage||'archived'}"></span><span class="name">${esc(p.name)}</span></div>`;
      }).join("");
      list.querySelectorAll(".proj-item").forEach(el => {
        el.addEventListener("click", () => {
          selectProject(el.dataset.name || null);
        });
      });
      overview.onclick = () => selectProject(null);
    }

    function renderActivityFeed(projects) {
      const activities = getFilteredProjects(projects).flatMap(project => (project.changelog || []).flatMap(entry =>
        entry.items.map(text => ({ project: project.name, date: entry.date, text }))
      )).sort((a, b) => b.date.localeCompare(a.date)).filter(activity => !isTestActivity(activity.text)).slice(0, 20);
      const filteredActivities = selectedProject ? activities.filter(activity => activity.project === selectedProject) : activities;
      document.getElementById("activity-count").textContent = `${filteredActivities.length} 条最近变更`;
      document.getElementById("activity-list").innerHTML = filteredActivities.map(activity => `
        <div class="activity-item">
          <span class="activity-date">${esc(activity.date)}</span>
          <span class="proj-tag ${projectColors[activity.project] || "t4"}">${esc(activity.project)}</span>
          <span class="activity-text">${esc(activity.text)}</span>
        </div>
      `).join("") || `<div class="empty">No recent activity</div>`;
    }

    function isTestActivity(text) {
      return text.includes("__") || text.includes("stale_task_test");
    }

    function selectProject(project) {
      selectedProject = project;
      const params = new URLSearchParams(window.location.search);
      if (project) params.set("project", project); else params.delete("project");
      const query = params.toString();
      window.history.replaceState(null, "", `${window.location.pathname}${query ? "?" + query : ""}${window.location.hash}`);
      renderProjects(cachedData.projects);
      renderHealthCards(cachedData.projects);
      renderTrends(cachedData.projects);
      renderGoalOverview(cachedData.projects);
      renderActivityFeed(cachedData.projects);
      renderBoard(cachedData.projects);
    }

    function openProjectDrawer(projectName) {
      const drawerProject = cachedData.projects.find(project => project.name === projectName);
      if (!drawerProject) return;
      drawerProjectName = projectName;
      document.getElementById("project-drawer-title").textContent = drawerProject.name;
      const statusLabels = { todo: "Todo", "in-progress": "In Progress", done: "Done" };
      const drawerTaskBoard = `
        <div class="drawer-columns">
          ${Object.entries(drawerProject.tasks).map(([status, items]) => `
            <div class="drawer-column">
              <h4>${statusLabels[status] || status} · ${items.length}</h4>
              ${items.map(text => `<div class="drawer-task">${esc(text)}</div>`).join("") || `<div class="empty">Empty</div>`}
            </div>
          `).join("")}
        </div>
      `;
      const drawerTimeline = `
        <div class="drawer-timeline">
          ${(drawerProject.changelog || []).flatMap(entry => entry.items.filter(text => !isTestActivity(text)).map(text => ({ date: entry.date, text }))).slice(0, 30).map(item => `
            <div class="drawer-timeline-item"><span class="drawer-timeline-date">${esc(item.date)}</span><span>${esc(item.text)}</span></div>
          `).join("") || `<div class="empty">No timeline entries</div>`}
        </div>
      `;
      document.getElementById("project-drawer-body").innerHTML = `
        <section class="drawer-section"><h3>Description</h3><div>${esc(drawerProject.meta.description || drawerProject.meta.summary || "暂无描述")}</div></section>
        <section class="drawer-section"><h3>Board</h3>${drawerTaskBoard}</section>
        <section class="drawer-section"><h3>Timeline</h3>${drawerTimeline}</section>
      `;
      document.getElementById("project-drawer-overlay").hidden = false;
    }

    function closeProjectDrawer() {
      document.getElementById("project-drawer-overlay").hidden = true;
    }

    function renderBoard(projects) {
      const filtered = getFilteredProjects(projects);
      document.getElementById("main-title").textContent = selectedProject || "监控看板";

      // description + goals
      const infoSection = document.getElementById("info-section");
      if (selectedProject) {
        const proj = filtered[0];
        const infoEditing = infoSection.querySelector(".desc-edit") || infoSection.querySelector(".goal-add-container[style*='block']");
        if (proj && !infoEditing) {
          infoSection.style.display = "block";
          document.getElementById("proj-desc").textContent = proj.meta.description || proj.meta.summary || "";
          const goalsList = document.getElementById("goals-list");
          goalsList.innerHTML = (proj.goals || []).map((g, i) =>
            `<div class="goal-item${g.done ? " done" : ""}"><span class="goal-box" data-goal-idx="${i}" data-goal-done="${g.done}">${g.done ? "✓" : ""}</span><span class="goal-text">${esc(g.text)}</span><button class="goal-del-btn" title="Delete">×</button></div>`
          ).join("") || `<div class="empty">No goals defined</div>`;
        }
      } else {
        infoSection.style.display = "none";
      }

      const all = { todo: [], "in-progress": [], done: [] };
      for (const p of filtered) {
        for (const status of Object.keys(all)) {
          for (const text of (p.tasks[status] || [])) {
            all[status].push({ text, project: p.name });
          }
        }
      }

      for (const status of ["todo", "in-progress", "done"]) {
        const col = document.getElementById("col-" + status);
        if (col.querySelector(".add-form input")) continue;
        const items = all[status];
        const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
        if (pageState[status] >= totalPages) pageState[status] = totalPages - 1;
        const start = pageState[status] * PAGE_SIZE;
        const pageItems = items.slice(start, start + PAGE_SIZE);
        document.getElementById("count-" + status).textContent = items.length;
          col.innerHTML = pageItems.length
          ? pageItems.map(t => `<div class="task" draggable="true" data-text="${escAttr(t.text)}" data-project="${escAttr(t.project)}" data-status="${status}">${status === "in-progress" ? `<span class="running-dot"></span>` : ""}<span class="proj-tag ${projectColors[t.project]||'t4'}">${esc(t.project)}</span><br><span class="task-text">${esc(t.text)}</span><button class="move-btn" title="Move to next">→</button><button class="del-btn" title="Delete">×</button></div>`).join("")
          : "";
          col.insertAdjacentHTML("afterbegin", `<button class="add-btn" data-col="${status}">+ Add Task</button>`);
          const footer = document.getElementById("footer-" + status);
          if (totalPages > 1) {
            footer.style.display = "flex";
            document.getElementById("page-" + status).textContent = `${pageState[status]+1} / ${totalPages}`;
            document.getElementById("prev-" + status).disabled = pageState[status] === 0;
            document.getElementById("next-" + status).disabled = pageState[status] >= totalPages - 1;
          } else {
            footer.style.display = "none";
          }
      }

      const tlMap = {};
      for (const p of filtered) {
        for (const entry of (p.changelog || [])) {
          if (!tlMap[entry.date]) tlMap[entry.date] = [];
          for (const item of entry.items.filter(item => !isTestActivity(item))) {
            tlMap[entry.date].push({ text: item, project: p.name });
          }
        }
      }
      const dates = Object.keys(tlMap).sort().reverse();
      document.getElementById("timeline").innerHTML = dates.map(date => `
        <div class="tl-entry">
          <div class="tl-date">${esc(date)}</div>
          <div class="tl-items">${tlMap[date].map(t => `<div class="tl-item"><span class="proj-tag ${projectColors[t.project]||'t4'}">${esc(t.project)}</span><span>${esc(t.text)}</span></div>`).join("")}</div>
        </div>`).join("") || `<div class="empty">No entries</div>`;
      document.getElementById("timeline-day").innerHTML = dates.map(date => `
        <div class="tl-day-card">
          <div class="tl-date">${esc(date)}</div>
          ${tlMap[date].map(t => `<div class="tl-item"><span class="proj-tag ${projectColors[t.project]||'t4'}">${esc(t.project)}</span><span>${esc(t.text)}</span></div>`).join("")}
        </div>`).join("") || `<div class="empty">No entries</div>`;
    }

    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    function escAttr(s) { return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    const healthGrid = document.getElementById("health-grid");
    healthGrid.addEventListener("click", event => {
      const card = event.target.closest(".health-card");
      if (card) openProjectDrawer(card.dataset.name);
    });

    const projectDrawerOverlay = document.getElementById("project-drawer-overlay");
    projectDrawerOverlay.addEventListener("click", event => {
      if (event.target === projectDrawerOverlay || event.target.closest("#project-drawer-close")) closeProjectDrawer();
    });
    document.getElementById("project-drawer-open").addEventListener("click", () => {
      selectProject(drawerProjectName);
      closeProjectDrawer();
    });

    document.getElementById("filter-input").addEventListener("input", event => {
      filters.query = event.target.value;
      refreshFilteredViews();
    });
    document.querySelectorAll("[data-filter-status]").forEach(checkbox => {
      checkbox.addEventListener("change", () => {
        if (checkbox.checked) filters.statuses.add(checkbox.dataset.filterStatus); else filters.statuses.delete(checkbox.dataset.filterStatus);
        refreshFilteredViews();
      });
    });
    document.getElementById("updated-filter").addEventListener("change", event => {
      filters.updatedWithin = event.target.value;
      refreshFilteredViews();
    });
    document.getElementById("filter-reset").addEventListener("click", () => {
      filters.query = "";
      filters.statuses = new Set(["todo", "in-progress", "done"]);
      filters.updatedWithin = "all";
      document.getElementById("filter-input").value = "";
      document.getElementById("updated-filter").value = "all";
      document.querySelectorAll("[data-filter-status]").forEach(checkbox => { checkbox.checked = true; });
      refreshFilteredViews();
    });
    document.getElementById("export-md").addEventListener("click", () => downloadReport("md"));
    document.getElementById("export-html").addEventListener("click", () => downloadReport("html"));

    function setupEventDelegation() {
      for (const status of ["todo", "in-progress", "done"]) {
        document.getElementById("prev-" + status).addEventListener("click", () => { if (pageState[status] > 0) { pageState[status]--; renderBoard(cachedData.projects); } });
        document.getElementById("next-" + status).addEventListener("click", () => { pageState[status]++; renderBoard(cachedData.projects); });
      }
      for (const status of ["todo", "in-progress", "done"]) {
        const col = document.getElementById("col-" + status);
        col.addEventListener("dragover", e => { e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect = "move"; col.classList.add("drag-over"); });
        col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
        col.addEventListener("drop", async e => {
          e.preventDefault();
          col.classList.remove("drag-over");
          try {
            const data = JSON.parse(e.dataTransfer.getData("text/plain"));
            if (data.status === status) return;
            await fetch("/api/tasks", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: data.project, action: "move", status: data.status, to: status, text: data.text }) });
          } catch (err) { console.error(err); }
          load();
        });
      }

      document.addEventListener("dragstart", e => {
        const task = e.target.closest(".task");
        if (!task) return;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", JSON.stringify({ text: task.dataset.text, project: task.dataset.project, status: task.dataset.status }));
        task.classList.add("dragging");
      });
      document.addEventListener("dragend", e => {
        const task = e.target.closest(".task");
        if (task) task.classList.remove("dragging");
      });

      document.addEventListener("click", async e => {
        const el = e.target;

        // goal checkbox toggle
        const goalBox = el.closest(".goal-box");
        if (goalBox) {
          const newDone = goalBox.dataset.goalDone !== "true";
          const goalText = goalBox.closest(".goal-item").querySelector(".goal-text").textContent;
          const project = selectedProject || "Agents Dashboard";
          await post("/api/goals", { project, text: goalText, done: newDone });
          return;
        }

        // goal delete
        const goalDel = el.closest(".goal-del-btn");
        if (goalDel) {
          const goalText = goalDel.closest(".goal-item").querySelector(".goal-text").textContent;
          const project = selectedProject || "Agents Dashboard";
          await post("/api/goals", { project, action: "delete", text: goalText });
          return;
        }

        // task delete
        const delBtn = el.closest(".del-btn");
        if (delBtn) {
          const task = delBtn.closest(".task");
          await post("/api/tasks", { project: task.dataset.project, action: "delete", status: task.dataset.status, text: task.dataset.text });
          return;
        }

        // task move button (→)
        const moveBtn = el.closest(".move-btn");
        if (moveBtn) {
          const task = moveBtn.closest(".task");
          const currentStatus = task.dataset.status;
          const nextStatus = currentStatus === "todo" ? "in-progress" : "done";
          await post("/api/tasks", { project: task.dataset.project, action: "move", status: currentStatus, to: nextStatus, text: task.dataset.text });
          return;
        }

        // task add ok
        const okBtn = el.closest(".task-add-ok");
        if (okBtn) {
          const form = okBtn.closest(".add-form");
          const input = form?.querySelector("input");
          const text = input?.value.trim();
          const status = okBtn.dataset.col;
          const project = selectedProject || "Agents Dashboard";
          if (text && status && project) {
            const addBtnHTML = `<button class="add-btn" data-col="${status}">+ Add Task</button>`;
            await post("/api/tasks", { project, action: "add", status, text });
            form.outerHTML = addBtnHTML;
          } else {
            form.replaceWith(`<button class="add-btn" data-col="${okBtn.dataset.col}">+ Add Task</button>`);
          }
          return;
        }

        // task add: show form
        const addBtn = el.closest(".add-btn");
        if (addBtn) {
          const form = document.createElement("div");
          form.className = "add-form";
          form.innerHTML = `<input type="text" placeholder="Task description…"><button class="task-add-ok" data-col="${addBtn.dataset.col}">OK</button>`;
          addBtn.replaceWith(form);
          form.querySelector("input").focus();
          form.querySelector("input").addEventListener("keydown", ev => {
            if (ev.key === "Enter") {
              ev.preventDefault();
              const input = ev.target;
              const text = input.value.trim();
              const status = addBtn.dataset.col;
              const project = selectedProject || "Agents Dashboard";
              if (text && status && project) {
                input.closest(".add-form").outerHTML = `<button class="add-btn" data-col="${status}">+ Add Task</button>`;
                post("/api/tasks", { project, action: "add", status, text });
              } else {
                input.closest(".add-form").replaceWith(addBtn);
              }
            }
            if (ev.key === "Escape") { ev.target.closest(".add-form").replaceWith(addBtn); }
          });
          return;
        }
      });

      async function post(url, body) {
        try {
          await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          load();
        } catch (err) { console.error(err); }
      }
    }

    load();
    setupEventDelegation();

    // ── SSE: auto-refresh when agent updates via API ──
    const evtSource = new EventSource("/api/events");
    evtSource.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.type === "agent-update" || data.type === "agent-heartbeat") load();
      } catch (err) {}
    };
    document.getElementById("refresh-btn").addEventListener("click", () => load());

    // ── Motivational quotes ──
    const quotes = [
      "每一个小小的进步，都是通往目标的阶梯。",
      "行动是治愈恐惧的良药，犹豫拖延将不断滋养恐惧。",
      "不要等待机会，而要创造机会。",
      "成功的秘诀在于坚持自己的目标和信念。",
      "种一棵树最好的时间是十年前，其次是现在。",
      "你今天的努力，是幸运的伏笔。",
      "把每一天当作新的起点，把每一次尝试当作成长。",
      "路虽远，行则将至；事虽难，做则必成。",
      "不要因为走得太远而忘记为什么出发。",
      "所有的美好，都需要一点耐心和一点勇气。",
    ];
    let quoteIdx = Math.floor(Math.random() * quotes.length);
    const quoteBar = document.getElementById("quote-bar");
    quoteBar.textContent = `「 ${quotes[quoteIdx]} 」`;
    quoteBar.addEventListener("click", () => {
      quoteIdx = (quoteIdx + 1) % quotes.length;
      quoteBar.textContent = `「 ${quotes[quoteIdx]} 」`;
    });
    setInterval(() => {
      quoteIdx = (quoteIdx + 1) % quotes.length;
      quoteBar.style.opacity = "0";
      setTimeout(() => { quoteBar.textContent = `「 ${quotes[quoteIdx]} 」`; quoteBar.style.opacity = "1"; }, 300);
    }, 30000);

    // ── Inline edit for tasks and goals ──
    document.addEventListener("dblclick", async e => {
      const goalText = e.target.closest(".goal-text");
      if (goalText && !goalText.querySelector("textarea")) {
        const current = goalText.textContent;
        const ta = document.createElement("textarea");
        ta.className = "inline-edit";
        ta.value = current;
        ta.rows = 1;
        goalText.textContent = "";
        goalText.appendChild(ta);
        ta.focus();
        ta.select();
        const save = async () => {
          const val = ta.value.trim();
          if (val && val !== current && selectedProject) {
            const goalItem = goalText.closest(".goal-item");
            const done = goalItem.classList.contains("done");
            await fetch("/api/goal-text", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: selectedProject, oldText: current, newText: val, done }) });
            load();
          } else {
            goalText.textContent = current;
          }
        };
        ta.addEventListener("blur", save);
        ta.addEventListener("keydown", ev => {
          if (ev.key === "Enter") { ev.preventDefault(); ta.blur(); }
          if (ev.key === "Escape") { ta.value = current; ta.blur(); }
        });
        return;
      }

      const taskEl = e.target.closest(".task");
      if (taskEl && !taskEl.querySelector(".inline-edit")) {
        const textSpan = taskEl.querySelector(".task-text");
        if (!textSpan) return;
        const current = textSpan.textContent.trim();
        if (!current) return;
        const ta = document.createElement("textarea");
        ta.className = "inline-edit";
        ta.value = current;
        ta.rows = 1;
        textSpan.textContent = "";
        textSpan.appendChild(ta);
        ta.focus();
        ta.select();
        const save = async () => {
          const val = ta.value.trim();
          if (val && val !== current) {
            await fetch("/api/task-text", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: taskEl.dataset.project, status: taskEl.dataset.status, oldText: current, newText: val }) });
          } else {
            textSpan.textContent = current;
          }
          load();
        };
        ta.addEventListener("blur", save);
        ta.addEventListener("keydown", ev => {
          if (ev.key === "Enter") { ev.preventDefault(); ta.blur(); }
          if (ev.key === "Escape") { ta.value = current; ta.blur(); }
        });
      }
    });

    // ── Theme toggle ──
    const savedTheme = localStorage.getItem("dashboard-theme") || "light";
    document.documentElement.setAttribute("data-theme", savedTheme);
    updateThemeLabel();
    document.getElementById("theme-toggle").addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("dashboard-theme", next);
      updateThemeLabel();
    });
    function updateThemeLabel() {
      const t = document.documentElement.getAttribute("data-theme");
      document.getElementById("theme-toggle").textContent = t === "dark" ? "☀ 亮色主题" : "◐ 暗色主题";
    }

    // ── Description edit ──
    document.getElementById("desc-edit-btn").addEventListener("click", () => {
      const descEl = document.getElementById("proj-desc");
      if (descEl.querySelector("textarea")) return;
      const current = descEl.textContent;
      descEl.innerHTML = `<textarea class="desc-edit">${esc(current)}</textarea>`;
      const ta = descEl.querySelector("textarea");
      ta.focus();
      const save = async () => {
        const val = ta.value.trim();
        if (val && val !== current && selectedProject) {
          await fetch("/api/description", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: selectedProject, description: val }) });
          load();
        } else {
          descEl.textContent = current;
        }
      };
      ta.addEventListener("blur", save);
      ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ta.blur(); } if (e.key === "Escape") { ta.value = current; ta.blur(); } });
    });

    // ── Goals add ──
    document.getElementById("goal-add-btn").addEventListener("click", () => {
      document.getElementById("goal-add-container").style.display = "block";
      document.getElementById("goal-add-input").focus();
    });
    document.getElementById("goal-add-save").addEventListener("click", async () => {
      const text = document.getElementById("goal-add-input").value.trim();
      if (!text || !selectedProject) return;
      document.getElementById("goal-add-container").style.display = "none";
      document.getElementById("goal-add-input").value = "";
      await fetch("/api/goals", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: selectedProject, action: "add", text }) });
      load();
    });
    document.getElementById("goal-add-input").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("goal-add-save").click(); if (e.key === "Escape") document.getElementById("goal-add-container").style.display = "none"; });

    // ── Goals delete ──
    document.addEventListener("click", async e => {
      const goalDel = e.target.closest(".goal-del-btn");
      if (goalDel && selectedProject) {
        const goalText = goalDel.closest(".goal-item").querySelector(".goal-text").textContent;
        await fetch("/api/goals", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: selectedProject, action: "delete", text: goalText }) });
        load();
      }
    });

    // ── Timeline view toggle ──
    document.getElementById("tl-list-btn").addEventListener("click", () => {
      document.getElementById("tl-list-btn").classList.add("active");
      document.getElementById("tl-day-btn").classList.remove("active");
      document.getElementById("timeline").style.display = "block";
      document.getElementById("timeline-day").style.display = "none";
    });
    document.getElementById("tl-day-btn").addEventListener("click", () => {
      document.getElementById("tl-day-btn").classList.add("active");
      document.getElementById("tl-list-btn").classList.remove("active");
      document.getElementById("timeline").style.display = "none";
      document.getElementById("timeline-day").style.display = "grid";
    });
  </script>
</body>
</html>
