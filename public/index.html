<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agents Dashboard</title>
  <style>
    :root {
      --bg: #0a0a0f; --surface: #141419; --border: #26262e;
      --text: #e8e8ed; --text2: #71717a; --accent: #7c6ff0;
      --green: #34d399; --yellow: #fbbf24;
      --card-bg: #1a1a22; --card-hover: #202029;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -.02em; }
    .header .sub { color: var(--text2); font-size: .78rem; }

    .projects { padding: 1rem 2rem; display: flex; flex-wrap: wrap; gap: .5rem; }
    .proj-pill { display: inline-flex; align-items: center; gap: .4rem; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: .3rem .8rem; font-size: .78rem; cursor: default; }
    .proj-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
    .proj-pill .dot.active { background: var(--green); }
    .proj-pill .dot.paused { background: var(--yellow); }
    .proj-pill .dot.done { background: var(--accent); }
    .proj-pill .dot.archived { background: var(--text2); }

    .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; padding: 1rem 2rem 3rem; }
    @media (max-width: 800px) { .kanban { grid-template-columns: 1fr; } }
    .col { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .col-header { padding: .85rem 1rem; display: flex; align-items: center; gap: .5rem; border-bottom: 1px solid var(--border); }
    .col-header .icon { width: 8px; height: 8px; border-radius: 2px; }
    .col-header h2 { font-size: .82rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .col-header .count-badge { font-size: .68rem; background: var(--bg); border-radius: 999px; padding: .1rem .5rem; color: var(--text2); margin-left: auto; }
    .col-body { padding: .75rem; display: flex; flex-direction: column; gap: .5rem; min-height: 200px; }

    .task { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: .7rem .85rem; font-size: .82rem; line-height: 1.45; transition: border-color .15s, background .15s; }
    .task:hover { border-color: var(--accent); background: var(--card-hover); }
    .task .proj-tag { display: inline-block; font-size: .65rem; font-weight: 600; padding: .05rem .45rem; border-radius: 4px; margin-bottom: .3rem; }
    .task .proj-tag.t0 { background: rgba(124,111,240,.15); color: var(--accent); }
    .task .proj-tag.t1 { background: rgba(52,211,153,.15); color: var(--green); }
    .task .proj-tag.t2 { background: rgba(251,191,36,.15); color: var(--yellow); }
    .task .proj-tag.t3 { background: rgba(248,113,113,.15); color: #f87171; }
    .task .proj-tag.t4 { background: rgba(255,255,255,.08); color: var(--text2); }

    .col.todo .icon { background: var(--text2); }
    .col.in-progress .icon { background: var(--yellow); }
    .col.done .icon { background: var(--green); }
    .col.done .task { opacity: .6; }
    .col.done .task:hover { opacity: 1; }
    .empty { color: var(--text2); font-size: .78rem; text-align: center; padding: 2rem 0; }

    /* Timeline */
    .timeline-section { padding: 0 2rem 3rem; }
    .timeline-title { font-size: .82rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text2); margin-bottom: 1rem; }
    .timeline { position: relative; padding-left: 1.5rem; }
    .timeline::before { content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
    .tl-entry { position: relative; margin-bottom: 1.25rem; }
    .tl-entry::before { content: ''; position: absolute; left: -1.5rem; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--green); border: 2px solid var(--bg); }
    .tl-date { font-size: .75rem; font-weight: 600; color: var(--text2); margin-bottom: .35rem; }
    .tl-items { display: flex; flex-direction: column; gap: .3rem; }
    .tl-item { font-size: .8rem; line-height: 1.5; padding: .4rem .65rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: baseline; gap: .5rem; }
    .tl-item .proj-tag { display: inline-block; font-size: .62rem; font-weight: 600; padding: .05rem .4rem; border-radius: 4px; flex-shrink: 0; }
    .tl-item .proj-tag.t0 { background: rgba(124,111,240,.15); color: var(--accent); }
    .tl-item .proj-tag.t1 { background: rgba(52,211,153,.15); color: var(--green); }
    .tl-item .proj-tag.t2 { background: rgba(251,191,36,.15); color: var(--yellow); }
    .tl-item .proj-tag.t3 { background: rgba(248,113,113,.15); color: #f87171; }
    .tl-item .proj-tag.t4 { background: rgba(255,255,255,.08); color: var(--text2); }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Agents Dashboard</h1>
      <div class="sub" id="root-label"></div>
    </div>
    <div class="sub" id="fetched-at"></div>
  </div>
  <div class="projects" id="projects"></div>
  <div class="kanban">
    <div class="col todo">
      <div class="col-header"><span class="icon"></span><h2>Todo</h2><span class="count-badge" id="count-todo"></span></div>
      <div class="col-body" id="col-todo"></div>
    </div>
    <div class="col in-progress">
      <div class="col-header"><span class="icon"></span><h2>In Progress</h2><span class="count-badge" id="count-in-progress"></span></div>
      <div class="col-body" id="col-in-progress"></div>
    </div>
    <div class="col done">
      <div class="col-header"><span class="icon"></span><h2>Done</h2><span class="count-badge" id="count-done"></span></div>
      <div class="col-body" id="col-done"></div>
    </div>
  </div>
  <div class="timeline-section">
    <div class="timeline-title">Timeline</div>
    <div class="timeline" id="timeline"></div>
  </div>
  <script>
    const projectColors = {};
    let colorIdx = 0;
    const colorClasses = ["t0","t1","t2","t3","t4"];

    async function load() {
      try {
        const res = await fetch("/api/projects");
        const { root, projects, fetchedAt } = await res.json();
        document.getElementById("root-label").textContent = root;
        document.getElementById("fetched-at").textContent = new Date(fetchedAt).toLocaleTimeString();

        document.getElementById("projects").innerHTML = projects.map(p => {
          if (!projectColors[p.name]) projectColors[p.name] = colorClasses[colorIdx++ % colorClasses.length];
          return `<span class="proj-pill"><span class="dot ${p.meta.stage||'archived'}"></span>${esc(p.name)}</span>`;
        }).join("");

        const all = { todo: [], "in-progress": [], done: [] };
        for (const p of projects) {
          for (const status of Object.keys(all)) {
            for (const text of (p.tasks[status] || [])) {
              all[status].push({ text, project: p.name });
            }
          }
        }

        for (const status of ["todo", "in-progress", "done"]) {
          const col = document.getElementById("col-" + status);
          const items = all[status];
          document.getElementById("count-" + status).textContent = items.length;
          col.innerHTML = items.length
            ? items.map(t => `<div class="task"><span class="proj-tag ${projectColors[t.project]||'t4'}">${esc(t.project)}</span><br>${esc(t.text)}</div>`).join("")
            : `<div class="empty">—</div>`;
        }

        // timeline: aggregate changelog entries from all projects
        const tlMap = {};
        for (const p of projects) {
          for (const entry of (p.changelog || [])) {
            if (!tlMap[entry.date]) tlMap[entry.date] = [];
            for (const item of entry.items) {
              tlMap[entry.date].push({ text: item, project: p.name });
            }
          }
        }
        const dates = Object.keys(tlMap).sort().reverse();
        document.getElementById("timeline").innerHTML = dates.map(date => `
          <div class="tl-entry">
            <div class="tl-date">${esc(date)}</div>
            <div class="tl-items">${tlMap[date].map(t => `<div class="tl-item"><span class="proj-tag ${projectColors[t.project]||'t4'}">${esc(t.project)}</span><span>${esc(t.text)}</span></div>`).join("")}</div>
          </div>`).join("") || `<div class="empty">No entries</div>`;
      } catch (e) { console.error(e); }
    }
    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
